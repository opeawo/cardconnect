# Render blueprint for CardConnect.
# Reference: https://render.com/docs/blueprint-spec
#
# Deploys the Express + Vite app as a single web service with a persistent
# disk so SQLite data.db survives deploys and restarts.
services:
  - type: web
    name: cardconnect
    runtime: node
    plan: starter
    region: oregon
    branch: main
    # Build the client (Vite -> dist/public) and bundle the server (esbuild -> dist/index.cjs).
    # Use `npm install` (NOT `npm ci --omit=dev`) so devDependencies like esbuild,
    # vite, tsx, and typescript are available during the build step. The bundle
    # produced by esbuild is fully self-contained, so the running container does
    # not need devDependencies at runtime.
    buildCommand: npm install --include=dev && npm run build
    # Serve the bundled production server
    startCommand: node dist/index.cjs
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # DEEPSEEK_API_KEY is set in the Render dashboard, not committed to the repo.
      - key: DEEPSEEK_API_KEY
        sync: false
      # Point better-sqlite3 at the mounted persistent disk so contacts and
      # card images survive redeploys and container restarts.
      - key: DATABASE_PATH
        value: /var/data/cardconnect.db
    disk:
      name: cardconnect-data
      mountPath: /var/data
      sizeGB: 1
